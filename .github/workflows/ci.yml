name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      # Not preinstalled on ubuntu-latest, so fetch a pinned release and check its checksum.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tgz" -C "$tmp" actionlint
          "$tmp/actionlint"

      - name: Makefile parses
        run: make -n help

      - name: TOML and YAML parse
        run: |
          python3 -c 'import sys, tomllib; tomllib.load(open(sys.argv[1], "rb"))' vm/mise.toml
          yq . lima/pie.yaml > /dev/null

      - name: Verify mise digest matches pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./versions.env
          asset="mise-v${MISE_VERSION}-linux-arm64.tar.gz"
          digest=$(gh api "repos/jdx/mise/releases/tags/v${MISE_VERSION}" \
            --jq ".assets[] | select(.name == \"${asset}\") | .digest")
          [ "$digest" = "sha256:${MISE_SHA256_ARM64}" ] || { echo "digest mismatch: '$digest'" >&2; exit 1; }
